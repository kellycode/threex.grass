<!DOCTYPE html>
<script src="vendor/three_66/three.min.js"></script>
<script src="../threex.grass.js"></script>
<body style="margin: 0px; overflow: hidden">
    <script>
        let loadTextures = function (callback) {
            var textureLoader = new THREE.TextureLoader();
            var textures = [];
            var loadedCount = 0;
            var onLoad = function (item) {
                console.log(item.image.currentSrc);
                textures.push(item);
                loadedCount++;
                if (loadedCount === 4) {
                    runTheThing(textures);
                }
            };
            var onError = function (item) {
                console.log(item);
            };
            textureLoader.onLoad = onLoad;

            var textureUrl_1 = THREEx.createGrassTufts.baseUrl + "images/grass01.png";
            var texture_1 = textureLoader.load(textureUrl_1, onLoad, undefined, onError);
            var textureUrl_2 = THREEx.createGrassTufts.baseUrl + "images/grass02.png";
            var texture_2 = textureLoader.load(textureUrl_2, onLoad, undefined, onError);
            var textureUrl_3 = THREEx.createGrassTufts.baseUrl + "images/flowers01.png";
            var texture_3 = textureLoader.load(textureUrl_3, onLoad, undefined, onError);
            var textureUrl_4 = THREEx.createGrassTufts.baseUrl + "images/flowers02.png";
            var texture_4 = textureLoader.load(textureUrl_4, onLoad, undefined, onError);
        };

        loadTextures();

        let attemptRandom = function (textures) {
            var nTufts = 5000;
            var positions = new Array(nTufts);
            for (var i = 0; i < nTufts; i++) {
                var position = new THREE.Vector3();
                position.x = (Math.random() - 0.5) * 20;
                position.z = (Math.random() - 0.5) * 20;
                positions[i] = position;
            }
        };

        let runTheThing = function (textures) {
            var renderer = new THREE.WebGLRenderer({
                antialias: true,
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor("lightblue", 1);
            document.body.appendChild(renderer.domElement);

            var onRenderFcts = [];
            var scene = new THREE.Scene();
            var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
            camera.position.z = 1;

            //////////////////////////////////////////////////////////////////////////////////
            //		set 3 point lighting						//
            //////////////////////////////////////////////////////////////////////////////////

            (function () {
                // add a ambient light
                var light = new THREE.AmbientLight(0x020202);
                scene.add(light);
                // add a light in front
                var light = new THREE.DirectionalLight("white", 1);
                light.position.set(0.5, 0.5, 2);
                scene.add(light);
                // add a light behind
                var light = new THREE.DirectionalLight("white", 0.75);
                light.position.set(-0.5, -0.5, -2);
                scene.add(light);
            })();

            // add a light behind
            var light = new THREE.DirectionalLight("white", 1);
            // var light	= new THREE.PointLight('white', 2)
            scene.add(light);
            light.position.y = 1;
            onRenderFcts.push(function (delta, now) {
                var angle = now * Math.PI * 2 * 0.2;
                light.position.x = Math.cos(angle) * 3;
                light.position.y = Math.sin(angle) * 3;
                // light.position.z= Math.sin(angle)*3
            });

            //////////////////////////////////////////////////////////////////////////////////
            //		grass ground							//
            //////////////////////////////////////////////////////////////////////////////////

            var textureUrl = "images/grasslight-small.jpg";
            var texture = THREE.ImageUtils.loadTexture(textureUrl);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.x = 10;
            texture.repeat.y = 10;
            texture.anisotropy = renderer.getMaxAnisotropy();

            // build object3d
            var geometry = new THREE.PlaneGeometry(20, 20);
            var material = new THREE.MeshPhongMaterial({
                map: texture,
                emissive: "green",
            });
            var object3d = new THREE.Mesh(geometry, material);
            object3d.rotateX(-Math.PI / 2);
            scene.add(object3d);

            //////////////////////////////////////////////////////////////////////////////////
            //		comment								//
            //////////////////////////////////////////////////////////////////////////////////

            var nTufts = 5000;
            var positions = new Array(nTufts);
            for (var i = 0; i < nTufts; i++) {
                var position = new THREE.Vector3();
                position.x = (Math.random() - 0.5) * 20;
                position.z = (Math.random() - 0.5) * 20;
                positions[i] = position;
            }
            THREEx.createGrassTufts(scene, positions, textures[0]);

            //////////////////////////////////////////////////////////////////////////////////
            //		comment								//
            //////////////////////////////////////////////////////////////////////////////////

            var nTufts = 5000;
            var positions = new Array(nTufts);
            for (var i = 0; i < nTufts; i++) {
                var position = new THREE.Vector3();
                position.x = (Math.random() - 0.5) * 20;
                position.z = (Math.random() - 0.5) * 20;
                positions[i] = position;
            }
            THREEx.createGrassTufts(scene, positions, textures[1]);

            //////////////////////////////////////////////////////////////////////////////////
            //		comment								//
            //////////////////////////////////////////////////////////////////////////////////
            var nTufts = 100;
            var positions = new Array(nTufts);
            for (var i = 0; i < nTufts; i++) {
                var position = new THREE.Vector3();
                position.x = (Math.random() - 0.5) * 20;
                position.z = (Math.random() - 0.5) * 20;
                positions[i] = position;
            }
            THREEx.createGrassTufts(scene, positions, textures[2]);

            //////////////////////////////////////////////////////////////////////////////////
            //		comment								//
            //////////////////////////////////////////////////////////////////////////////////
            var nTufts = 100;
            var positions = new Array(nTufts);
            for (var i = 0; i < nTufts; i++) {
                var position = new THREE.Vector3();
                position.x = (Math.random() - 0.5) * 20;
                position.z = (Math.random() - 0.5) * 20;
                positions[i] = position;
            }
            THREEx.createGrassTufts(scene, positions, textures[3]);

            //////////////////////////////////////////////////////////////////////////////////
            //		Camera Controls							//
            //////////////////////////////////////////////////////////////////////////////////
            var mouse = { x: 0, y: 0 };
            document.addEventListener(
                "mousemove",
                function (event) {
                    mouse.x = event.clientX / window.innerWidth - 0.5;
                    mouse.y = event.clientY / window.innerHeight - 0.5;
                },
                false
            );
            onRenderFcts.push(function (delta, now) {
                camera.position.x += (mouse.x * 2 - camera.position.x) * (delta * 3);
                camera.position.y += (mouse.y * 2 - camera.position.y) * (delta * 3);
                camera.lookAt(scene.position);
            });

            //////////////////////////////////////////////////////////////////////////////////
            //		render the scene						//
            //////////////////////////////////////////////////////////////////////////////////
            onRenderFcts.push(function () {
                renderer.render(scene, camera);
            });

            //////////////////////////////////////////////////////////////////////////////////
            //		loop runner							//
            //////////////////////////////////////////////////////////////////////////////////
            var lastTimeMsec = null;
            requestAnimationFrame(function animate(nowMsec) {
                // keep looping
                requestAnimationFrame(animate);
                // measure time
                lastTimeMsec = lastTimeMsec || nowMsec - 1000 / 60;
                var deltaMsec = Math.min(200, nowMsec - lastTimeMsec);
                lastTimeMsec = nowMsec;
                // call each update function
                onRenderFcts.forEach(function (onRenderFct) {
                    onRenderFct(deltaMsec / 1000, nowMsec / 1000);
                });
            });
        };
    </script>
</body>
